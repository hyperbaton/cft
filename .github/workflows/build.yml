# Compiles the mod and runs its game tests (src/test/java/com/hyperbaton/cft/gametest) on a
# headless game test server, which fails the build if any test fails.
name: Build

on:
  push:
    branches: [1.21.x]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # gradlew isn't marked executable in the repository
      - run: chmod +x gradlew
      - run: ./gradlew build
      - run: ./gradlew runGameTestServer
